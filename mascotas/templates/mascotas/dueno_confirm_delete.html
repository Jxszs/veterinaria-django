{% extends 'base.html' %}
{% block title %}Eliminar dueño{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h3 class="h5 mb-0">⚠️ Confirmar eliminación</h3>
            </div>
            <div class="card-body">
                <div class="alert alert-light border">
                    <p><strong>Dueño:</strong> {{ object.nombre }}</p>
                    <p><strong>Usuario:</strong> {{ object.user.get_username }}</p>
                    <p class="mb-0 small text-muted">Sus mascotas no se borran: quedan registradas sin dueño asignado.</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Eliminar dueño</button>
                        <a href="{% url 'mascotas:lista_duenos' %}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
