{% extends 'base.html' %}
{% load veterinaria_extras %}
{% block title %}Eliminar factura{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white"><h3 class="h5 mb-0">⚠️ Confirmar eliminación</h3></div>
            <div class="card-body">
                <div class="alert alert-light border">
                    <p><strong>Factura:</strong> {{ object.numero }} (anulada)</p>
                    <p><strong>Dueño:</strong> {{ object.dueno.nombre }}</p>
                    <p class="mb-0"><strong>Total:</strong> {{ object.total|clp }}</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Eliminar factura</button>
                        <a href="{% url 'mascotas:detalle_factura' object.pk %}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
